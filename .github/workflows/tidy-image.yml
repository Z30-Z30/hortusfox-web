name: Tidy UI - build image

# Builds HortusFox + Tidy UI on top of the current official HortusFox image and publishes it
# to this repository's container registry. Runs weekly so new HortusFox releases are picked up.
on:
  push:
    branches: [tidy-ui]
    paths:
      - 'tidy/**'
      - '.github/workflows/tidy-image.yml'
  schedule:
    - cron: '47 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/hortusfox-tidy" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: tidy/Dockerfile
          pull: true
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.name.outputs.image }}:latest
