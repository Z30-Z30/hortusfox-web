# Local demo/development instance. Not for production: throwaway credentials, no volumes.
name: hortusfox-tidy-demo
services:
  app:
    build:
      context: ../..
      dockerfile: tidy/Dockerfile
    ports:
      - "127.0.0.1:8090:80"
    environment:
      APP_ADMIN_EMAIL: "demo@example.com"
      APP_ADMIN_PASSWORD: "demodemo123"
      APP_TIMEZONE: "Europe/Berlin"
      APP_LANG: "${DEMO_LANG:-en}"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: hortusfox
      DB_USERNAME: hortusfox
      DB_PASSWORD: demodb123
      DB_CHARSET: "utf8mb4"
    depends_on:
      - db
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: demoroot123
      MARIADB_DATABASE: hortusfox
      MARIADB_USER: hortusfox
      MARIADB_PASSWORD: demodb123
