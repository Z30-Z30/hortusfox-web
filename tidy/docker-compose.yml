# HortusFox with the Tidy UI. Copy this file, replace every CHANGE_ME value, then run:
#   docker compose up -d
# The database is not published to the host; only the web interface is.
services:
  app:
    image: hortusfox-tidy:latest
    build:
      context: ..
      dockerfile: tidy/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - app_images:/var/www/html/public/img
      - app_attachments:/var/www/html/public/attachments
      - app_logs:/var/www/html/app/logs
      - app_backup:/var/www/html/public/backup
      - app_themes:/var/www/html/public/themes
      - app_migrate:/var/www/html/app/migrations
    environment:
      APP_ADMIN_EMAIL: "CHANGE_ME@example.com"
      APP_ADMIN_PASSWORD: "CHANGE_ME"        # letters and digits only
      APP_TIMEZONE: "UTC"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: hortusfox
      DB_USERNAME: hortusfox
      DB_PASSWORD: "CHANGE_ME"               # letters and digits only
      DB_CHARSET: "utf8mb4"
    depends_on:
      - db

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "CHANGE_ME"
      MARIADB_DATABASE: hortusfox
      MARIADB_USER: hortusfox
      MARIADB_PASSWORD: "CHANGE_ME"          # same value as DB_PASSWORD above
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
  app_images:
  app_attachments:
  app_logs:
  app_backup:
  app_themes:
  app_migrate:
